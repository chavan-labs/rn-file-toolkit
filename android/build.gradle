def FileToolkitConfig = [
  kotlinVersion: "2.2.0",
  minSdkVersion: 24,
  // Fallbacks only — a React Native app sets these in its root build.gradle and
  // they win via getExtOrDefault. They must not lag behind the compileSdk that
  // react-android itself is built against, or AGP fails the consuming build with
  // "dependency requires a higher compileSdk".
  compileSdkVersion: 37,
  targetSdkVersion: 36
]

def getExtOrDefault(prop) {
  return rootProject.ext.has(prop) ? rootProject.ext.get(prop) : FileToolkitConfig[prop]
}

buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0"
  }
}

apply plugin: "com.android.library"
// AGP 9 ships built-in Kotlin; only apply the plugin when the app opted out of it.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}
apply plugin: "com.facebook.react"

android {
  namespace "com.filetoolkit"

  compileSdk getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion")
    targetSdk getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  // React Native 0.81+ compiles against Java 17. Leaving this library on 1.8
  // makes Kotlin and Java disagree on the JVM target and AGP aborts the build
  // with "Inconsistent JVM-target compatibility detected". Kotlin derives its
  // jvmTarget from this, so no deprecated kotlinOptions block is needed.
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
